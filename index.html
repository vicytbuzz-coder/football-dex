function wishPopupHtml(n) {
  const wc = wishClub(n);
  return `<div style="font-family:'DM Sans',sans-serif;min-width:180px"><div style="display:flex;align-items:center">${wc ? logoImg(wc, 34) : ''}<div style="min-width:0"><div style="font-size:15px;font-weight:600;color:#1a1a18">${escHtml(wishInfo(n).title)}</div><div style="font-size:13px;color:#6b6860;margin-top:2px">${wishInfo(n).sub ? escHtml(wishInfo(n).sub) + (wishInfo(n).cap ? ' · ' + wishInfo(n).cap : '') + (wishInfo(n).km ? ' · ' + wishInfo(n).km : '') : 'Stade à faire'}</div></div></div><button onclick="startPlacing('${jsq(n)}')" style="margin-top:10px;padding:7px 12px;border:1px solid #e5e0d8;border-radius:8px;background:#fff;font-family:inherit;font-size:12px;font-weight:600;color:#6b6860;cursor:pointer">📍 Déplacer</button></div>`;
}

// Pins bleus : le nom du stade apparaît en bulle quand on zoome, le clic ouvre la fiche
function renderMapPins() {
  mapLayer.clearLayers();
  const groups = {}, missing = [];
  let total = 0;
  const wish = mapMode === 'wish';
  const add = (c, pos) => {
    total++;
    if (!pos) { missing.push(c); return; }
    const k = pos.join(',');
    (groups[k] = groups[k] || { pos, clubs: [] }).clubs.push(c);
  };
  if (wish) (db.__wish || []).forEach(n => add(n, wishPos(n)));
  else LEAGUES.forEach(l => {
    if (l.isGlobal) return;
    [...l.clubs, ...(l.relegated || [])].forEach(c => { if (get(c).status === 'stadium') add(c, posOf(c)); });
  });
  mapMissing = missing;
  lastPinTier = pinTier();
  Object.values(groups).forEach(g => {
    const names = [...new Set(g.clubs.map(c => wish ? wishInfo(c).title : (get(c).stadiumName || c)))];
    const m = L.marker(g.pos, { icon: pinIcon() });
    m.bindPopup(g.clubs.map(wish ? wishPopupHtml : mapPopupHtml).join('<hr style="border:none;border-top:1px solid #e5e0d8;margin:10px 0">'), { maxWidth: 260 });
    m._tip = escHtml(names.join(' · '));
    m.addTo(mapLayer);
  });
  const shown = total - missing.length;
  $('map-chip').textContent = `🗺️ ${shown} stade${shown > 1 ? 's' : ''}${wish ? ' à faire' : ''}` + (missing.length ? ` · ${missing.length} à placer ›` : '');
  renderMissingSheet();
  applyPinSize();
}

// Changement de zoom : on ajuste seulement la taille des pins (le popup ouvert reste ouvert)
const TIP_OPTS = { permanent: true, direction: 'top', offset: [0, -4], className: 'stadium-tip' };
function syncTips() {
  const show = stadiumMap.getZoom() >= 7;   // en dessous, les étiquettes ne sont pas visibles : on ne les garde pas dans la page
  mapLayer.eachLayer(m => {
    if (!m._tip) return;
    if (show && !m.getTooltip()) m.bindTooltip(m._tip, TIP_OPTS);
    else if (!show && m.getTooltip()) m.unbindTooltip();
  });
}
function applyPinSize() {
  if (!stadiumMap || !mapLayer) return;
  syncTips();
  const t = pinTier();
  if (t !== lastPinTier) {
    lastPinTier = t;
    mapLayer.eachLayer(m => { if (m.setIcon) m.setIcon(pinIcon()); });
  }
}

// Cadre exactement tous les pins (sans animation)
function fitPins() {
  if (!stadiumMap || !mapLayer) return;
  const pts = [];
  mapLayer.eachLayer(m => { if (m.getLatLng) pts.push(m.getLatLng()); });
  if (pts.length) stadiumMap.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [28, 80], paddingBottomRight: [28, 28], maxZoom: 10, animate: false });
  else stadiumMap.setView([48.5, 8], 4, { animate: false });
}

// --- Positions à compléter (clubs sans position connue) ---
function renderMissingSheet() {
  const sheet = $('map-sheet');
  if (placingClub) {
    sheet.innerHTML = `<div class="sheet-head"><div class="sheet-title">📍 Touche la carte pour placer « ${escHtml(placingClub)} »</div><button class="sheet-btn" onclick="cancelPlacing()">Annuler</button></div>`;
    sheet.classList.add('open');
    return;
  }
  if (!sheetOpen || !mapMissing.length) { sheet.classList.remove('open'); return; }
  sheet.innerHTML = `<div class="sheet-head"><div class="sheet-title">Stades à placer</div><button class="sheet-x" onclick="toggleMissingSheet()">✕</button></div>`
    + mapMissing.map(c => `<div class="sheet-row">
        ${(mapMode === 'wish' ? wishClub(c) : c) ? logoImg(mapMode === 'wish' ? wishClub(c) : c, 28) : ''}
        <div class="sheet-info"><div class="sheet-club">${escHtml(c)}</div><div class="sheet-stadium">${mapMode === 'wish' ? 'Stade à faire' : (escHtml(get(c).stadiumName) || 'Stade non renseigné')}</div></div>
        <button class="sheet-btn" onclick="autoPlace('${jsq(c)}')">🔎 Auto</button>
        <button class="sheet-btn" onclick="startPlacing('${jsq(c)}')">📍 Placer</button>
      </div>`).join('')
    + `<div class="sheet-msg" id="sheet-msg"></div>`;
  sheet.classList.add('open');
}

function toggleMissingSheet() {
  if (!mapMissing.length && !sheetOpen) return;
  sheetOpen = !sheetOpen;
  renderMissingSheet();
}

function startPlacing(club) {
  placingClub = club;
  stadiumMap.closePopup();
  $('stadium-map').style.cursor = 'crosshair';
  renderMissingSheet();
}

function cancelPlacing() {
  placingClub = null;
  $('stadium-map').style.cursor = '';
  renderMissingSheet();
}

async function autoPlace(club) {
  const msg = $('sheet-msg');
  const d = get(club);
  const q = d.stadiumName ? d.stadiumName : `${club} stadium`;
  if (msg) msg.textContent = 'Recherche en cours…';
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const data = await res.json();
    if (data && data[0]) {
      setPos(club, parseFloat(data[0].lat), parseFloat(data[0].lon));
      renderMapPins();
      stadiumMap.setView(db.__pos[club], 13);
    } else if (msg) msg.textContent = 'Introuvable : utilise « Placer » pour le mettre toi-même.';
  } catch (e) {
    if (msg) msg.textContent = 'Recherche impossible (connexion ?). Utilise « Placer ».';
  }
}

// --- Fond de secours : seulement si le vrai fond de carte ne charge pas ---
function ensurePanes() {
  ['basemap', 'labels'].forEach((name, i) => {
    if (!stadiumMap.getPane(name)) {
      const p = stadiumMap.createPane(name);
      p.style.zIndex = 300 + i * 10;
      p.style.pointerEvents = 'none';
    }
  });
}

function addFallbackMap() {
  if (fallbackLayer || bordersLayer || tilesOk || !stadiumMap) return;
  ensurePanes();
  $('stadium-map').style.background = '#dde6ec';
  fallbackLayer = L.layerGroup();
  EUROPE_LAND.forEach(poly => L.polygon(poly, { pane:'basemap', color:'#c8c3b6', weight:1, fillColor:'#f4f2ec', fillOpacity:1, interactive:false }).addTo(fallbackLayer));
  BORDERS.forEach(line => L.polyline(line, { pane:'basemap', color:'#aaa393', weight:1.3, opacity:0.9, interactive:false }).addTo(fallbackLayer));
  COUNTRY_LABELS.forEach(([name, lat, lng]) => L.marker([lat, lng], {
    pane:'labels', interactive:false, keyboard:false,
    icon: L.divIcon({ className:'country-label', html:name, iconSize:[120, 14], iconAnchor:[60, 7] })
  }).addTo(fallbackLayer));
  fallbackLayer.addTo(stadiumMap);
}

// Vraies frontières (téléchargées seulement si le fond de carte est indisponible)
async function loadBorders() {
  if (bordersRequested || tilesOk) return;
  bordersRequested = true;
  try {
    if (!window.topojson) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js');
    const topo = await (await fetch(BORDERS_URL)).json();
    if (tilesOk) return;
    ensurePanes();
    const land = topojson.feature(topo, topo.objects.countries);
    const lines = topojson.mesh(topo, topo.objects.countries);
    const layer = L.layerGroup();
    L.geoJSON(land, { pane:'basemap', interactive:false, style:{ stroke:false, fillColor:'#f4f2ec', fillOpacity:1 } }).addTo(layer);
    L.geoJSON(lines, { pane:'basemap', interactive:false, style:{ color:'#9a937f', weight:1, fill:false } }).addTo(layer);
    COUNTRY_LABELS.forEach(([name, lat, lng]) => L.marker([lat, lng], {
      pane:'labels', interactive:false, keyboard:false,
      icon: L.divIcon({ className:'country-label', html:name, iconSize:[120, 14], iconAnchor:[60, 7] })
    }).addTo(layer));
    layer.addTo(stadiumMap);
    bordersLayer = layer;
    if (fallbackLayer) stadiumMap.removeLayer(fallbackLayer);
    $('stadium-map').style.background = '#dde6ec';
  } catch (e) { /* on garde le fond dessiné à la main */ }
}

function clearFallback() {
  if (fallbackLayer) stadiumMap.removeLayer(fallbackLayer);
  if (bordersLayer) stadiumMap.removeLayer(bordersLayer);
  fallbackLayer = null;
  bordersLayer = null;
  $('stadium-map').style.background = '#e8e6e0';
}

function initMap() {
  const mapEl = $('stadium-map');
  stadiumMap = L.map('stadium-map', {
    zoomControl: false, minZoom: 3.5, maxZoom: 15, zoomSnap: 0.25, preferCanvas: true,
    maxBounds: [[15, -50], [78, 65]], maxBoundsViscosity: 0.5
  }).setView([48.5, 8], 4);
  L.control.zoom({ position: 'bottomright' }).addTo(stadiumMap);

  const base = L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 15, maxNativeZoom: 16, attribution: 'Tiles © Esri', updateWhenZooming: false, keepBuffer: 1 });
  base.once('tileload', () => { tilesOk = true; clearFallback(); });
  base.on('tileerror', () => { if (!tilesOk) setTimeout(addFallbackMap, 800); });
  base.addTo(stadiumMap);
  // Noms de pays et de villes par-dessus le fond
  L.tileLayer(ESRI + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 15, maxNativeZoom: 16, updateWhenZooming: false, keepBuffer: 1 }).addTo(stadiumMap);
  stadiumMap.attributionControl.setPrefix(false);
  mapLayer = L.layerGroup().addTo(stadiumMap);

  // Le fond de secours n'apparaît que si rien ne s'est affiché après 1,5 s ; les vraies frontières après 3 s
  setTimeout(() => { if (!tilesOk) addFallbackMap(); }, 1500);
  setTimeout(() => { if (!tilesOk) loadBorders(); }, 3000);

  stadiumMap.on('click', e => {
    if (!placingClub) return;
    setPos(placingClub, e.latlng.lat, e.latlng.lng);
    placingClub = null;
    mapEl.style.cursor = '';
    renderMapPins();
  });
  stadiumMap.on('zoomend', applyPinSize);
  // Pendant la mise en place (1,5 s), on recadre si la taille de l'écran bouge
  stadiumMap.on('resize', () => { if (Date.now() < settleUntil) fitPins(); });
  // Dès que tu touches la carte, on arrête de la recadrer toute seule (sinon un redimensionnement pendant le geste la remet à zéro)
  ['touchstart', 'mousedown', 'wheel'].forEach(ev => mapEl.addEventListener(ev, () => { settleUntil = 0; }, { passive: true }));
  if (window.ResizeObserver) new ResizeObserver(() => stadiumMap.invalidateSize({ pan: false })).observe(mapEl);
}

function openMapModal(mode) {
  mapMode = mode === 'wish' ? 'wish' : 'visited';
  const chip = $('map-chip');
  chip.textContent = '🗺️ Chargement…';
  $('overlay-map').classList.add('open');
  ensureLeaflet().then(() => {
    if (!stadiumMap) initMap();
    settleUntil = Date.now() + 1500;
    setTimeout(() => { stadiumMap.invalidateSize({ pan: false }); renderMapPins(); fitPins(); }, 150);
  }).catch(() => { chip.textContent = 'Carte indisponible (connexion requise)'; });
}

function closeMapModal() {
  placingClub = null;
  sheetOpen = false;
  $('overlay-map').classList.remove('open');
}

// ---------- 9. Sauvegarde, swipe, démarrage ----------
async function exportData() {
  const leagues = {};
  LEAGUES.forEach(l => {
    if (l.isGlobal) return;
    leagues[l.id] = { clubs: l.isAutre ? l.clubs : undefined, relegated: l.relegated || [] };
  });
  const payload = { app:'football-dex', version:1, exportedAt:new Date().toISOString(), db, photos, leagues };
  const name = `football-dex-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(payload)], name, { type:'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:'Football Dex' });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function importData(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || data.app !== 'football-dex' || typeof data.db !== 'object') throw new Error('format');
      if (!confirm('Remplacer toutes les données actuelles par celles du fichier ?')) return;
      db = data.db || {};
      normPlus();
      migrateNames();
      photos = data.photos || {};
      Object.keys(RENAMES).forEach(o => { if (photos[o] !== undefined) { if (photos[RENAMES[o]] === undefined) photos[RENAMES[o]] = photos[o]; delete photos[o]; } });
      LEAGUES.forEach(l => {
        const s = data.leagues && data.leagues[l.id];
        if (!s) return;
        if (l.isAutre) l.clubs = s.clubs || [];
        l.relegated = s.relegated || [];
      });
      persist();
      persistPhotos();
      init();
      alert('Données importées.');
    } catch (err) {
      alert("Fichier invalide : impossible d'importer.");
    }
  };
  reader.readAsText(file);
}

// Swipe gauche/droite entre les championnats
let swipeStart = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || document.querySelector('.overlay.open') || e.target.closest('.tabs-wrap')) { swipeStart = null; return; }
  swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipeStart) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const ids = LEAGUES.map(l => l.id);
  const next = ids.indexOf(document.querySelector('.tab.active').dataset.id) + (dx < 0 ? 1 : -1);
  if (next >= 0 && next < ids.length) switchTab(ids[next]);
}, { passive: true });

// Icône du site (onglet du navigateur et écran d'accueil)
(function setSiteIcon() {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 130 130">'
    + '<rect width="130" height="130" rx="30" fill="#047857"/>'
    + '<rect x="6" y="20" width="118" height="90" rx="28" fill="#10b981" stroke="#f7f6f2" stroke-width="3.5"/>'
    + '<rect x="15" y="29" width="100" height="72" rx="21" fill="#047857" stroke="#f7f6f2" stroke-width="3"/>'
    + '<rect x="27" y="40" width="76" height="50" rx="3" fill="none" stroke="#f7f6f2" stroke-width="2.5"/>'
    + '<path d="M65 40v8M65 82v8" stroke="#f7f6f2" stroke-width="2.5"/>' 
    + '<rect x="27" y="51" width="13" height="28" fill="none" stroke="#f7f6f2" stroke-width="2.5"/><rect x="90" y="51" width="13" height="28" fill="none" stroke="#f7f6f2" stroke-width="2.5"/>'
    + '<circle cx="65" cy="65" r="14" fill="#f7f6f2"/>'
    + '<path d="M58 65l5 5 9-10.5" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + '</svg>';
  const url = 'data:image/svg+xml,' + encodeURIComponent(svg);
  const icon = document.createElement('link');
  icon.rel = 'icon'; icon.type = 'image/svg+xml'; icon.href = url;
  document.head.appendChild(icon);
  const img = new Image();
  img.onload = () => {
    try {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 180;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#047857';
      ctx.fillRect(0, 0, 180, 180);
      ctx.drawImage(img, 0, 0, 180, 180);
      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = cv.toDataURL('image/png');
      document.head.appendChild(apple);
    } catch (e) {}
  };
  img.src = url;
})();

// Mode hors ligne et mises à jour : voir sw.js (à placer à côté de cette page)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
}

$('country-list').innerHTML = [...Object.keys(COUNTRY_ISO), ...Object.values(LEAGUE_COUNTRY)].map(n => `<option value="${n}">`).join('');

// Titres sur deux lignes : repérés automatiquement pour remonter un peu les détails (.deux-lignes)
(function () {
  if (!('ResizeObserver' in window)) return;
  const ro = new ResizeObserver(entries => {
    entries.forEach(en => {
      const el = en.target;
      if (!el.isConnected) { ro.unobserve(el); return; }
      if (!el.offsetHeight) return;
      el.classList.toggle('deux-lignes', el.offsetHeight > 30);
    });
  });
  let planned = false;
  const scan = () => {
    planned = false;
    document.querySelectorAll('.club-name:not([data-ro])').forEach(el => { el.dataset.ro = '1'; ro.observe(el); });
  };
  new MutationObserver(() => { if (!planned) { planned = true; requestAnimationFrame(scan); } }).observe(document.body, { childList:true, subtree:true });
  scan();
})();

load();
init();
</script>
